            try {
                const savedUrls = localStorage.getItem('math5a_unit_urls');
                if (savedUrls) {
                    unitUrls = JSON.parse(savedUrls);
                } else {
                    unitsData.forEach(u => {

                        if (u.subsections) {
                            u.subsections.forEach(sub => {
                                unitUrls[sub.id] = sub.defaultUrl;
                            });
                        }
                    });
                }

                const savedCompleted = localStorage.getItem('math5a_completed_units');

                    completedUnits = JSON.parse(savedCompleted);
                }
            } catch (e) {
                console.error("Local storage error", e);

                                      unit.tags.some(t => t.toLowerCase().includes(searchVal)) ||
                                      (unit.subsections && unit.subsections.some(s => s.id.toLowerCase().includes(searchVal) || s.title.toLowerCase().includes(searchVal)));

            const percent = Math.round((completedCount / total) * 100);

            document.getElementById('totalCount').innerText = total;
            document.getElementById('completedCount').innerText = completedCount;
            document.getElementById('progressText').innerText = `${percent}%`;

            const circle = document.getElementById('progressCircle');
            circle.setAttribute('stroke-dasharray', `${percent}, 100`);

        function initLineChartLogic() {
            const inputs = [
                document.getElementById('lc_v1'),
                document.getElementById('lc_v2'),
                document.getElementById('lc_v3'),
                document.getElementById('lc_v4'),
                document.getElementById('lc_v5')
            ];
            const svg = document.getElementById('lc_svg');
            const info = document.getElementById('lc_info');

            const draw = () => {
                const vals = inputs.map(inp => parseInt(inp.value) || 10);
                const xCoords = [50, 100, 150, 200, 250];
                // Y ranges from 5..50 mapped to 110..20
                const getY = (v) => 120 - (v / 50) * 100;

                const points = vals.map((v, i) => `${xCoords[i]},${getY(v)}`).join(' ');

                let svgContent = `
                    <line x1="30" y1="120" x2="280" y2="120" stroke="#475569" stroke-width="1.5"/>
                    <line x1="30" y1="10" x2="30" y2="120" stroke="#475569" stroke-width="1.5"/>
                    <polyline points="${points}" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                `;

                const months = ["1月", "2月", "3月", "4月", "5月"];
                vals.forEach((v, i) => {
                    const cx = xCoords[i];
                    const cy = getY(v);
                    svgContent += `
                        <circle cx="${cx}" cy="${cy}" r="5" fill="#f59e0b" class="cursor-pointer hover:r-7 transition-all">
                            <title>${months[i]}: ${v}°C</title>
                        </circle>
                        <text x="${cx}" y="${cy - 9}" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">${v}</text>
                        <text x="${cx}" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle">${months[i]}</text>
                    `;
                });

                svg.innerHTML = svgContent;

                const maxVal = Math.max(...vals);
                const maxMonth = months[vals.indexOf(maxVal)];
                info.innerHTML = `最高溫出現在 <b class="text-amber-300">${maxMonth} (${maxVal}°C)</b>。折線呈波浪起伏變化。`;
            };

            inputs.forEach(inp => { if (inp) inp.oninput = draw; });
            draw();
        }

                    <div class="flex items-center justify-center gap-2 mb-3">
                        <span class="text-xs text-slate-300">正整數 N：</span>
                        <input type="number" id="u2Input" value="24" min="1" max="100" class="w-20 bg-slate-900 text-indigo-300 font-mono text-center font-bold px-2 py-1 rounded-lg border border-indigo-500/40 text-sm">

        function initFactorsMultiplesLogic() {
            const input = document.getElementById('u2Input');
            const btn = document.getElementById('u2CalcBtn');
            const box = document.getElementById('u2ResultBox');

            const analyze = () => {
                const n = parseInt(input.value) || 24;
                let factors = [];
                let pairs = [];
                for(let i=1; i<=Math.sqrt(n); i++) {
                    if(n % i === 0) {
                        factors.push(i);
                        if(i !== n/i) factors.push(n/i);
                        pairs.push(`(${i} × ${n/i})`);
                    }
                }
                factors.sort((a,b)=>a-b);
                let multiples = [n, n*2, n*3, n*4, n*5];

                box.innerHTML = `
                    <div><b>${n} 的所有因數：</b> <span class="text-emerald-300 font-bold">${factors.join(', ')}</span> (共 ${factors.length} 個)</div>
                    <div><b>因數乘積對：</b> <span class="text-sky-300 font-bold">${pairs.join(' , ')}</span></div>
                    <div><b>${n} 的前 5 個倍數：</b> <span class="text-amber-300 font-bold">${multiples.join(', ')}...</span></div>
                    <div class="text-[11px] text-slate-400 pt-1 border-t border-white/10">提示：如果 ${n} 能被 d 整除，則 d 就是 ${n} 的因數！</div>
                `;
            };
            if(input) input.oninput = analyze;
            if(btn) btn.onclick = analyze;
            analyze();
        }

        function initPlaneGeometryLogic() {
            const sliderB = document.getElementById('pg_b');
            const sliderC = document.getElementById('pg_c');
            const txtB = document.getElementById('pg_b_txt');
            const txtC = document.getElementById('pg_c_txt');
            const svg = document.getElementById('pg_svg');
            const desc = document.getElementById('pg_desc');

            const update = () => {
                let degB = parseInt(sliderB.value) || 60;
                let degC = parseInt(sliderC.value) || 60;
                if (degB + degC >= 170) {
                    degC = 170 - degB;
                    sliderC.value = degC;
                }
                const degA = 180 - degB - degC;

                txtB.innerText = `${degB}°`;
                txtC.innerText = `${degC}°`;

                // 固定 BC 底邊的位置：B(50, 100), C(150, 100)
                const xB = 50, yB = 100;
                const xC = 150, yC = 100;
                const sideA = xC - xB; // BC 長度 = 100

                const radA = degA * Math.PI / 180;
                const radB = degB * Math.PI / 180;
                const radC = degC * Math.PI / 180;

                // 正弦定理計算 c 邊 (AB) 長度並推算頂點 A 座標
                const sideC = sideA * Math.sin(radC) / Math.sin(radA);
                const xA = xB + sideC * Math.cos(radB);
                const yA = yB - sideC * Math.sin(radB);

                // 動態調整 viewBox，確保高度過高的頂點 A 依然完整顯示
                const minY = Math.min(yA - 22, -10);
                const height = 125 - minY;
                svg.setAttribute('viewBox', `0 ${minY} 200 ${height}`);

                // 角內標示數字位置
                const labelAy = yA + 16;
                const labelBx = xB + 16, labelBy = yB - 8;
                const labelCx = xC - 16, labelCy = yC - 8;

                svg.innerHTML = `
                    <polygon points="${xA},${yA} ${xB},${yB} ${xC},${yC}" fill="rgba(217,70,239,0.2)" stroke="#d946ef" stroke-width="2.5"/>
                    
                    <!-- 頂點 ABC 標註於三角形外 -->
                    <text x="${xA}" y="${yA - 8}" fill="#38bdf8" font-size="12" font-weight="black" text-anchor="middle">A</text>
                    <text x="${xB - 10}" y="${yB + 12}" fill="#38bdf8" font-size="12" font-weight="black" text-anchor="end">B</text>
                    <text x="${xC + 10}" y="${yC + 12}" fill="#38bdf8" font-size="12" font-weight="black" text-anchor="start">C</text>

                    <!-- 角內只保留角度數字標記 -->
                    <text x="${xA}" y="${labelAy}" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">${degA}°</text>
                    <text x="${labelBx}" y="${labelBy}" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="start">${degB}°</text>
                    <text x="${labelCx}" y="${labelCy}" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="end">${degC}°</text>
                `;

                let triType = "銳角三角形";
                if (degA === 90 || degB === 90 || degC === 90) triType = "直角三角形";
                else if (degA > 90 || degB > 90 || degC > 90) triType = "鈍角三角形";

                desc.innerHTML = `
                    <div>1. <b>內角和公式：</b>${degA}° + ${degB}° + ${degC}° = <span class="text-emerald-300 font-bold">180°</span></div>
                    <div>2. <b>三角形分類：</b>屬於 <b class="text-sky-300">${triType}</b></div>
                `;
            };

            if (sliderB) sliderB.oninput = update;
            if (sliderC) sliderC.oninput = update;
            update();
        }

        function initCommonFactorsLogic() {
            const inpA = document.getElementById('cf_a');
            const inpB = document.getElementById('cf_b');
            const btn = document.getElementById('cf_calc_btn');
            const resBox = document.getElementById('cf_res_box');

            const compute = () => {
                let numA = Math.max(1, Math.min(99, parseInt(inpA.value) || 12));
                let numB = Math.max(1, Math.min(99, parseInt(inpB.value) || 18));
                inpA.value = numA;
                inpB.value = numB;

                // 1. 因數列舉與公因數
                let factorsA = [];
                for (let i = 1; i <= numA; i++) {
                    if (numA % i === 0) factorsA.push(i);
                }

                let factorsB = [];
                for (let i = 1; i <= numB; i++) {
                    if (numB % i === 0) factorsB.push(i);
                }

                let commonFactors = factorsA.filter(f => factorsB.includes(f));
                let gcd = Math.max(...commonFactors);

                let renderFactorsList = (factors) => {
                    return factors.map(f => {
                        if (commonFactors.includes(f)) {
                            return `<span class="px-1.5 py-0.5 bg-amber-500/20 text-amber-300 font-bold rounded border border-amber-400/40">${f}</span>`;
                        } else {
                            return `<span class="text-slate-300">${f}</span>`;
                        }
                    }).join(', ');
                };

                // 2. 倍數列舉與公倍數
                let multiplesA = [];
                for (let i = 1; i <= 8; i++) multiplesA.push(numA * i);

                let multiplesB = [];
                for (let i = 1; i <= 8; i++) multiplesB.push(numB * i);

                let a = numA, b = numB;
                while (b) { let t = b; b = a % b; a = t; }
                let lcm = (numA * numB) / a;

                let commonMultiples = [];
                for (let i = 1; i <= 4; i++) {
                    commonMultiples.push(lcm * i);
                }

                let renderMultiplesList = (multiples) => {
                    return multiples.map(m => {
                        if (m % lcm === 0) {
                            return `<span class="px-1.5 py-0.5 bg-emerald-500/20 text-emerald-300 font-bold rounded border border-emerald-400/40">${m}</span>`;
                        } else {
                            return `<span class="text-slate-300">${m}</span>`;
                        }
                    }).join(', ') + '...';
                };

                resBox.innerHTML = `
                    <div class="pb-2 border-b border-white/10 space-y-1.5">
                        <div class="text-sky-300 font-bold text-xs flex items-center gap-1">
                            <i class="fa-solid fa-list-check"></i> 4-2 公因數與最大公因數 (列舉法)
                        </div>
                        <div class="text-[11px] leading-relaxed">
                            <div>• <b>${numA} 的因數：</b> ${renderFactorsList(factorsA)}</div>
                            <div>• <b>${numB} 的因數：</b> ${renderFactorsList(factorsB)}</div>
                            <div class="pt-1"><b>公因數：</b> <span class="text-amber-300 font-bold">${commonFactors.join(', ')}</span></div>
                            <div><b>最大公因數 (GCD)：</b> <span class="text-emerald-300 font-extrabold text-sm">${gcd}</span></div>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <div class="text-sky-300 font-bold text-xs flex items-center gap-1">
                            <i class="fa-solid fa-arrow-trend-up"></i> 4-1 公倍數與最小公倍數 (列舉法)
                        </div>
                        <div class="text-[11px] leading-relaxed">
                            <div>• <b>${numA} 的倍數：</b> ${renderMultiplesList(multiplesA)}</div>
                            <div>• <b>${numB} 的倍數：</b> ${renderMultiplesList(multiplesB)}</div>
                            <div class="pt-1"><b>公倍數：</b> <span class="text-amber-300 font-bold">${commonMultiples.slice(0, 3).join(', ')}...</span></div>
                            <div><b>最小公倍數 (LCM)：</b> <span class="text-emerald-300 font-extrabold text-sm">${lcm}</span></div>
                        </div>
                    </div>
                `;
            };

            if (inpA) inpA.oninput = compute;
            if (inpB) inpB.oninput = compute;
            if (btn) btn.onclick = compute;
            compute();
        }

                    colLeft.innerHTML = `
                        <div>${a} × ( ${b} + ${c} )</div>
                        <div>= ${a} × <span class="text-emerald-300 font-bold">${b_plus_c}</span></div>
                        <div>= <span class="text-amber-300 font-bold text-sm">${leftResult}</span></div>
                    `;
                }

                if (colRight) {
                    colRight.innerHTML = `
                        <div>${a} × ${b} + ${a} × ${c}</div>
                        <div>= <span class="text-emerald-300 font-bold">${ab}</span> + <span class="text-emerald-300 font-bold">${ac}</span></div>
                        <div>= <span class="text-amber-300 font-bold text-sm">${rightResult}</span></div>
                    `;
                }

                if (resBox) {
                    resBox.innerHTML = `
                        <div class="text-[11px] text-slate-300 mb-0.5">驗證分配律結果相等：</div>
                        <div>${a} × ( ${b} + ${c} ) = ${a} × ${b} + ${a} × ${c} = <span class="text-emerald-300 font-bold text-sm">${leftResult}</span></div>
                    `;
                }
            };

            if (inpA) inpA.oninput = update;
            if (inpB) inpB.oninput = update;
            if (inpC) inpC.oninput = update;
            update();
        }

        function renderEquivalentFractionsDemo() {
            return `
                <div class="preview-center-wrapper">
                    <div class="text-xs text-sky-300 mb-2 font-bold"><i class="fa-solid fa-chart-pie text-sky-400 mr-1"></i>擴分與約分：調整倍數放大分子與分母：</div>
                    <div class="flex items-center justify-center gap-2 mb-3">
                        <span class="text-xs text-slate-300">基準分數：1/2，擴分倍數 (k)：</span>
                        <input type="range" id="ef_k" min="1" max="5" value="2" class="w-32 accent-sky-400">
                        <span id="ef_k_txt" class="font-mono font-bold text-amber-300 text-sm">2 倍</span>
                    </div>
                    <div id="ef_frac_display" class="flex justify-center items-center space-x-4 my-2 text-xl font-bold font-mono">
                    </div>
                    <div id="ef_pies" class="flex justify-center gap-6 my-2">
                    </div>
                    <div class="text-xs text-sky-200 bg-slate-900/80 px-4 py-2 rounded-xl border border-white/10 mt-1 max-w-md w-full">
                        分子與分母同乘相同倍數，代表分割越細（等分線增加），但整體佔比面積完全不變。
                    </div>
                </div>
            `;
        }
        function initEquivalentFractionsLogic() {
            const sliderK = document.getElementById('ef_k');
            const txtK = document.getElementById('ef_k_txt');
            const display = document.getElementById('ef_frac_display');
            const pies = document.getElementById('ef_pies');

            const update = () => {
                const k = parseInt(sliderK.value) || 2;
                txtK.innerText = `${k} 倍`;

                const num = 1 * k;
                const den = 2 * k;

                display.innerHTML = `
                    <div class="math-frac text-sky-300"><span class="math-frac-num">1</span><span class="math-frac-den">2</span></div>
                    <span class="text-slate-400">=</span>
                    <div class="math-frac text-amber-300"><span class="math-frac-num">1 × ${k}</span><span class="math-frac-den">2 × ${k}</span></div>
                    <span class="text-slate-400">=</span>
                    <div class="math-frac text-emerald-300"><span class="math-frac-num">${num}</span><span class="math-frac-den">${den}</span></div>
                `;

                // 畫 1/2 圓的 2 等分線
                let svg1Lines = '';
                for (let i = 0; i < 2; i++) {
                    const ang = (i * 180 - 90) * Math.PI / 180;
                    const x2 = 30 + 26 * Math.cos(ang);
                    const y2 = 30 + 26 * Math.sin(ang);
                    svg1Lines += `<line x1="30" y1="30" x2="${x2}" y2="${y2}" stroke="#ffffff" stroke-width="1.5" />`;
                }

                // 畫 num/den 圓的 2k 等分線
                let svg2Lines = '';
                for (let i = 0; i < den; i++) {
                    const ang = (i * (360 / den) - 90) * Math.PI / 180;
                    const x2 = 30 + 26 * Math.cos(ang);
                    const y2 = 30 + 26 * Math.sin(ang);
                    svg2Lines += `<line x1="30" y1="30" x2="${x2}" y2="${y2}" stroke="#ffffff" stroke-width="1.5" />`;
                }

                pies.innerHTML = `
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 flex items-center justify-center">
                            <svg viewBox="0 0 60 60" class="w-16 h-16">
                                <circle cx="30" cy="30" r="26" fill="rgba(255,255,255,0.08)" />
                                <path d="M 30 30 L 30 4 A 26 26 0 0 1 30 56 Z" fill="#38bdf8" />
                                <circle cx="30" cy="30" r="26" fill="none" stroke="#38bdf8" stroke-width="2" />
                                ${svg1Lines}
                            </svg>
                        </div>
                        <span class="text-[10px] text-slate-300 mt-1.5 font-bold">1/2 圓 (平分2份)</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 flex items-center justify-center">
                            <svg viewBox="0 0 60 60" class="w-16 h-16">
                                <circle cx="30" cy="30" r="26" fill="rgba(255,255,255,0.08)" />
                                <path d="M 30 30 L 30 4 A 26 26 0 0 1 30 56 Z" fill="#34d399" />
                                <circle cx="30" cy="30" r="26" fill="none" stroke="#34d399" stroke-width="2" />
                                ${svg2Lines}
                            </svg>
                        </div>
                        <span class="text-[10px] text-slate-300 mt-1.5 font-bold">${num}/${den} 圓 (平分${den}份)</span>
                    </div>
                `;
            };

            if (sliderK) sliderK.oninput = update;
            update();
        }

        function renderAreaFormulasDemo() {
            return `
                <div class="preview-center-wrapper">
                    <div class="text-xs text-cyan-300 mb-2 font-bold"><i class="fa-solid fa-vector-square text-cyan-400 mr-1"></i>切換圖形並拉動數據，計算面積：</div>
                    <div class="flex justify-center gap-2 mb-3">
                        <button onclick="selectAreaShape('pgram')" id="ab_pgram" class="px-2.5 py-1 bg-sky-600 text-white rounded-lg text-xs font-bold shadow">平行四邊形</button>
                        <button onclick="selectAreaShape('triangle')" id="ab_triangle" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold border border-white/10">三角形</button>
                        <button onclick="selectAreaShape('trapezoid')" id="ab_trapezoid" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold border border-white/10">梯形</button>
                    </div>
                    <div id="af_controls" class="flex flex-wrap items-center justify-center gap-3 mb-2 min-h-[32px]">
                    </div>
                    <div id="af_calc_res" class="bg-slate-900/90 p-3 rounded-2xl border border-cyan-500/30 font-mono text-sm text-amber-300 font-bold max-w-sm w-full">
                    </div>
                </div>
            `;
        }
        let currentAreaType = 'pgram';
        let afValB = 10;
        let afValH = 6;
        let afValTopB = 5;

        function selectAreaShape(type) {
            currentAreaType = type;
            ['pgram', 'triangle', 'trapezoid'].forEach(t => {
                const btn = document.getElementById(`ab_${t}`);
                if (btn) {
                    if (t === type) btn.className = "px-2.5 py-1 bg-sky-600 text-white rounded-lg text-xs font-bold shadow";
                    else btn.className = "px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold border border-white/10";
                }
            });
            renderAreaControls();
            updateAreaCalc();
        }

        function renderAreaControls() {
            const controls = document.getElementById('af_controls');
            if (!controls) return;

            if (currentAreaType === 'pgram' || currentAreaType === 'triangle') {
                controls.innerHTML = `
                    <label class="text-xs text-slate-300">底: <input type="range" id="af_b" min="4" max="20" value="${afValB}" class="w-20 accent-cyan-400"> <span id="af_b_txt" class="font-bold text-amber-300">${afValB}</span></label>
                    <label class="text-xs text-slate-300">高: <input type="range" id="af_h" min="2" max="15" value="${afValH}" class="w-20 accent-cyan-400"> <span id="af_h_txt" class="font-bold text-amber-300">${afValH}</span></label>
                `;
                const inpB = document.getElementById('af_b');
                const inpH = document.getElementById('af_h');
                if (inpB) inpB.oninput = (e) => { afValB = parseInt(e.target.value) || 1; updateAreaCalc(); };
                if (inpH) inpH.oninput = (e) => { afValH = parseInt(e.target.value) || 1; updateAreaCalc(); };
            } else if (currentAreaType === 'trapezoid') {
                controls.innerHTML = `
                    <label class="text-xs text-slate-300">上底: <input type="range" id="af_top_b" min="2" max="15" value="${afValTopB}" class="w-16 accent-cyan-400"> <span id="af_top_b_txt" class="font-bold text-amber-300">${afValTopB}</span></label>
                    <label class="text-xs text-slate-300">下底: <input type="range" id="af_b" min="4" max="20" value="${afValB}" class="w-16 accent-cyan-400"> <span id="af_b_txt" class="font-bold text-amber-300">${afValB}</span></label>
                    <label class="text-xs text-slate-300">高: <input type="range" id="af_h" min="2" max="15" value="${afValH}" class="w-16 accent-cyan-400"> <span id="af_h_txt" class="font-bold text-amber-300">${afValH}</span></label>
                `;
                const inpTopB = document.getElementById('af_top_b');
                const inpB = document.getElementById('af_b');
                const inpH = document.getElementById('af_h');
                if (inpTopB) inpTopB.oninput = (e) => { afValTopB = parseInt(e.target.value) || 1; updateAreaCalc(); };
                if (inpB) inpB.oninput = (e) => { afValB = parseInt(e.target.value) || 1; updateAreaCalc(); };
                if (inpH) inpH.oninput = (e) => { afValH = parseInt(e.target.value) || 1; updateAreaCalc(); };
            }
        }

        function updateAreaCalc() {
            const txtB = document.getElementById('af_b_txt');
            const txtH = document.getElementById('af_h_txt');
            const txtTopB = document.getElementById('af_top_b_txt');
            const res = document.getElementById('af_calc_res');

            if (txtB) txtB.innerText = afValB;
            if (txtH) txtH.innerText = afValH;
            if (txtTopB) txtTopB.innerText = afValTopB;

            if (!res) return;

            if (currentAreaType === 'pgram') {
                const area = afValB * afValH;
                res.innerHTML = `平行四邊形面積 = 底 × 高<br><span class="text-emerald-300">${afValB} × ${afValH} = ${area}</span>`;
            } else if (currentAreaType === 'triangle') {
                const area = (afValB * afValH) / 2;
                res.innerHTML = `三角形面積 = 底 × 高 ÷ 2<br><span class="text-emerald-300">${afValB} × ${afValH} ÷ 2 = ${area}</span>`;
            } else if (currentAreaType === 'trapezoid') {
                const area = ((afValTopB + afValB) * afValH) / 2;
                res.innerHTML = `梯形面積 = (上底 + 下底) × 高 ÷ 2<br><span class="text-emerald-300">(${afValTopB} + ${afValB}) × ${afValH} ÷ 2 = ${area}</span>`;
            }
        }

        function initAreaFormulasLogic() {
            selectAreaShape('pgram');
        }

        function renderMultiplyUnitFractionDemo() {
            return `
                <div class="preview-center-wrapper">
                    <div class="text-xs text-indigo-300 mb-2 font-bold">整數乘以 1/n 等同於整數除以 n：</div>
                    <div class="flex items-center justify-center gap-2 mb-3">
                        <span class="text-xs text-slate-300">總數：</span>
                        <input type="number" id="muf_val" value="24" min="4" max="60" step="2" class="w-16 bg-slate-900 text-indigo-300 font-mono text-center font-bold px-2 py-1 rounded-lg border border-indigo-500/40 text-sm">
                        <span class="text-xs text-slate-300">平分成 n 份：</span>
                        <input type="number" id="muf_n" value="4" min="2" max="10" class="w-12 bg-slate-900 text-indigo-300 font-mono text-center font-bold px-2 py-1 rounded-lg border border-indigo-500/40 text-sm">
                    </div>
                    <div id="muf_math_box" class="bg-slate-900/90 p-4 rounded-2xl border border-indigo-500/30 font-mono text-base flex items-center justify-center space-x-2 my-2">
                    </div>
                    <div id="muf_vis_grid" class="flex flex-col gap-2 items-start max-w-md w-full my-2 overflow-x-auto p-3 bg-slate-900/60 rounded-xl border border-white/10 custom-scrollbar">
                    </div>
                </div>
            `;
        }
        function initMultiplyUnitFractionLogic() {
            const inpVal = document.getElementById('muf_val');
            const inpN = document.getElementById('muf_n');
            const mBox = document.getElementById('muf_math_box');
            const vGrid = document.getElementById('muf_vis_grid');

            const update = () => {
                const total = parseInt(inpVal.value) || 24;
                const n = parseInt(inpN.value) || 4;
                const res = (total / n).toFixed(1).replace('.0', '');

                mBox.innerHTML = `
                    <span class="text-white font-bold">${total} × </span>
                    <div class="math-frac text-sky-300 font-bold"><span class="math-frac-num">1</span><span class="math-frac-den">${n}</span></div>
                    <span class="text-slate-300"> = ${total} ÷ ${n} = </span>
                    <span class="text-amber-300 font-black text-xl">${res}</span>
                `;

                let gridHtml = '';
                // 均勻分配計算邏輯：將餘數均勻散佈於前幾排
                const baseCount = Math.floor(total / n);
                const remCount = total % n;
                let currentItem = 1;

                for (let row = 0; row < n; row++) {
                    const itemsInThisRow = baseCount + (row < remCount ? 1 : 0);
                    const isSelectedRow = (row === 0);
                    let rowItemsHtml = '';
                    
                    for (let col = 0; col < itemsInThisRow && currentItem <= total; col++) {
                        rowItemsHtml += `
                            <div class="w-6 h-6 rounded-md ${isSelectedRow ? 'bg-amber-400 text-slate-950 font-bold shadow-sm' : 'bg-slate-800 text-slate-400'} flex items-center justify-center text-[10px] font-mono shrink-0">
                                ${currentItem}
                            </div>
                        `;
                        currentItem++;
                    }

                    if (rowItemsHtml !== '') {
                        gridHtml += `
                            <div class="flex items-center gap-2 justify-start w-full">
                                <span class="text-[11px] text-slate-300 font-bold w-12 shrink-0 text-left">第 ${row + 1} 排</span>
                                <div class="flex flex-wrap items-center gap-1.5 justify-start">
                                    ${rowItemsHtml}
                                </div>
                            </div>
                        `;
                    }
                }
                vGrid.innerHTML = gridHtml;
            };

            if (inpVal) inpVal.oninput = update;
            if (inpN) inpN.oninput = update;
            update();
        }

        function renderSectorsCircleDemo() {
            return `
                <div class="preview-center-wrapper">
                    <div class="text-xs text-teal-300 mb-2 font-bold"><i class="fa-solid fa-pie-chart text-teal-400 mr-1"></i>滑動調整圓心角，觀察扇形與幾分之幾圓：</div>
                    <div class="flex items-center justify-center gap-2 mb-3">
                        <span class="text-xs text-slate-300">圓心角：</span>
                        <input type="range" id="sc_deg" min="10" max="360" step="5" value="90" class="w-44 accent-teal-400">
                        <span id="sc_deg_txt" class="font-mono font-bold text-amber-300 text-sm w-12">90°</span>
                    </div>
                    <div class="flex justify-center items-center space-x-6 my-2">
                        <svg viewBox="0 0 100 100" class="w-28 h-28" id="sc_svg">
                        </svg>
                        <div id="sc_info" class="text-left text-xs space-y-1">
                        </div>
                    </div>
                </div>
            `;
        }
        function initSectorsCircleLogic() {
            const sliderDeg = document.getElementById('sc_deg');
            const txtDeg = document.getElementById('sc_deg_txt');
            const svg = document.getElementById('sc_svg');
            const info = document.getElementById('sc_info');

            const getGcd = (a, b) => b === 0 ? a : getGcd(b, a % b);

            const draw = () => {
                const deg = parseInt(sliderDeg.value) || 90;
                txtDeg.innerText = `${deg}°`;

                const rad = (deg * Math.PI) / 180;
                const cx = 50, cy = 50, r = 45;
                const x2 = cx + r * Math.cos(rad);
                const y2 = cy + r * Math.sin(rad);

                const largeArc = deg > 180 ? 1 : 0;

                let pathStr = '';
                if (deg >= 360) {
                    pathStr = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="2"/>`;
                } else {
                    pathStr = `
                        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#475569" stroke-width="1.5"/>
                        <path d="M ${cx} ${cy} L ${cx+r} ${cy} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="2"/>
                    `;
                }

                svg.innerHTML = `
                    ${pathStr}
                    <circle cx="${cx}" cy="${cy}" r="3" fill="#f59e0b"/>
                `;

                const g = getGcd(deg, 360);
                const simpNum = deg / g;
                const simpDen = 360 / g;

                let fracDisplay = '';
                if (deg === 360) {
                    fracDisplay = `<span class="text-emerald-300 font-bold">1 圓</span>`;
                } else {
                    fracDisplay = `<div class="math-frac text-emerald-300"><span class="math-frac-num">${simpNum}</span><span class="math-frac-den">${simpDen}</span></div><span class="text-emerald-300 font-bold"> 圓</span>`;
                }

                info.innerHTML = `
                    <div>圓心角：<span class="text-amber-300 font-bold">${deg}°</span></div>
                    <div>比例：<span class="math-frac text-sky-300"><span class="math-frac-num">${deg}</span><span class="math-frac-den">360</span></span></div>
                    <div class="flex items-center gap-1">約等於：${fracDisplay}</div>
                `;
            };

            if (sliderDeg) sliderDeg.oninput = draw;
            draw();
        }
    </script>
